[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linflonet"
version = "0.3.0"
description = "Generate simulation-ready 3D heart meshes from CT and MR images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "LinFlo-Net contributors" },
]
keywords = ["medical-imaging", "mesh-generation", "deep-learning", "cardiac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy<2,>=1.26.0",
    "pandas>=2.1.1",
    "torch>=2.2.0",
    "monai>=1.3.0",
    "SimpleITK>=2.3.1",
    "vtk>=9.3.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.scripts]
linflonet = "linflonet.cli:main"

[project.urls]
Homepage = "https://github.com/ArjunNarayanan/LinFlo-Net"
Repository = "https://github.com/ArjunNarayanan/LinFlo-Net"
Documentation = "https://github.com/ArjunNarayanan/LinFlo-Net/blob/main/docs/quick_start.md"
"Bug Tracker" = "https://github.com/ArjunNarayanan/LinFlo-Net/issues"
"PyPI" = "https://pypi.org/project/linflonet/"

[tool.setuptools.packages.find]
where = ["."]
include = ["linflonet*", "src*", "vtk_utils*"]

[tool.setuptools.package-data]
"linflonet.data.template" = ["*.vtp", "*.vtk"]
